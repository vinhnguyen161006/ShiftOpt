[project]
name = "shiftopt"
version = "0.1.0"
description = "ShiftOpt optimization engine: integer programming models for workforce shift scheduling"
requires-python = "==3.11.*"
dependencies = [
    "ortools==9.15.6755",
    "pulp[highs]==3.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shiftopt"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error:.*PuLP 4[.]0:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PT", "RUF", "SIM", "C4", "TC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"benchmarks/**" = ["S311"]
"src/shiftopt/staffing/call_arrivals.py" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pulp.*", "highspy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["shiftopt"]
