repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730
    hooks:
      - id: ruff-check
        name: ruff check (engine)
        args: [--config, engine/pyproject.toml]
        files: ^engine/
      - id: ruff-format
        name: ruff format (engine)
        args: [--config, engine/pyproject.toml]
        files: ^engine/
      - id: ruff-check
        name: ruff check (backend)
        args: [--config, backend/pyproject.toml]
        files: ^backend/
      - id: ruff-format
        name: ruff format (backend)
        args: [--config, backend/pyproject.toml]
        files: ^backend/

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: a1a56a60ddf7e9ba639fdd9f00f852d63ede4c04
    hooks:
      - id: uv-lock
        name: uv lock (engine)
        files: ^engine/(pyproject\.toml|uv\.lock)$
        args: [--project, engine, --check]
      - id: uv-lock
        name: uv lock (backend)
        files: ^(backend/(pyproject\.toml|uv\.lock)|engine/pyproject\.toml)$
        args: [--project, backend, --check]

  - repo: local
    hooks:
      - id: check-conventions
        name: check conventions (no comments, ASCII code)
        entry: python scripts/check_conventions.py
        language: system
        pass_filenames: false
